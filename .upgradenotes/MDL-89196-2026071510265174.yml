issueNumber: MDL-89196
notes:
  theme:
    - message: |
        The `core/loginform` template from the Boost theme has been moved to core.

        The previously used core version has not been used in core for some
        time, and was not tested or validated.
      type: changed
  core:
    - message: |
        A new React-based login form (`\core_auth\output\login_form`) has been
        added, along with supporting Swizzle-based React components, for use by
        the OAuth login flow being introduced in MDL-88472.


        The ordinary Moodle login page is unaffected and continues to use the
        existing `\core_auth\output\login` renderable, the
        `core_renderer::render_login()` renderer method, and the `core/loginform`
        Mustache template. Existing theme customisations of the ordinary login
        page do not need any changes.
      type: added
